# Ochiq Telegram kanalidan (t.me/s/<kanal>) postlar, rasmlar va logoni yuklab olib,
# "brand-import" branch'iga saqlaydi. Dizayn va mahsulot rasmlarini tayyorlash uchun bir martalik yordamchi.
name: Brend materiallarini olish (Telegram kanal)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Telegram kanal username (t.me/ dan keyingi qismi)"
        required: true
        default: "ayva_burgers"
      pages:
        description: "Nechta sahifa (har birida ~20 post)"
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Kanalni yuklab olish
        env:
          CH: ${{ inputs.channel }}
          PAGES: ${{ inputs.pages }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, time, urllib.request

          ch = os.environ["CH"].strip().lstrip("@")
          if not re.fullmatch(r"[A-Za-z0-9_]{4,32}", ch):
              sys.exit("noto'g'ri kanal nomi")
          pages = max(1, min(int(os.environ.get("PAGES") or 8), 20))
          os.makedirs("out/img", exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def save(url, path):
              try:
                  data = get(url)
                  open(path, "wb").write(data)
                  return True
              except Exception as e:
                  print("rasm yuklanmadi:", url, e)
                  return False

          profile = get(f"https://t.me/{ch}").decode("utf-8", "replace")
          open("out/profile.html", "w").write(profile)
          meta = {k: html.unescape(v) for k, v in re.findall(r'<meta property="og:(\w+)" content="([^"]*)"', profile)}
          if meta.get("image"):
              save(meta["image"], "out/avatar.jpg")

          posts, before = [], None
          for n in range(pages):
              url = f"https://t.me/s/{ch}" + (f"?before={before}" if before else "")
              page = get(url).decode("utf-8", "replace")
              open(f"out/page{n + 1}.html", "w").write(page)
              blocks = page.split('class="tgme_widget_message_wrap')[1:]
              if not blocks:
                  break
              for b in blocks:
                  m = re.search(r'data-post="[^/"]+/(\d+)"', b)
                  if not m:
                      continue
                  pid = int(m.group(1))
                  tm = re.search(r'<div class="tgme_widget_message_text[^"]*"[^>]*>(.*?)</div>', b, re.S)
                  text = ""
                  if tm:
                      text = re.sub(r"<br\s*/?>", "\n", tm.group(1))
                      text = html.unescape(re.sub(r"<[^>]+>", "", text)).strip()
                  dm = re.search(r'<time datetime="([^"]+)"', b)
                  imgs = re.findall(r"tgme_widget_message_photo_wrap[^>]*background-image:url\('([^']+)'\)", b)
                  files = []
                  for i, src in enumerate(imgs):
                      path = f"out/img/{pid}_{i + 1}.jpg"
                      if save(src, path):
                          files.append(os.path.basename(path))
                  posts.append({"id": pid, "date": dm.group(1) if dm else "", "text": text, "images": files})
              more = re.search(r'tme_messages_more[^>]*data-before="(\d+)"', page)
              if not more:
                  break
              before = more.group(1)
              time.sleep(1)

          posts.sort(key=lambda p: p["id"], reverse=True)
          json.dump({"channel": ch, "meta": meta, "posts": posts}, open("out/posts.json", "w"), ensure_ascii=False, indent=1)
          print(f"{len(posts)} post, {sum(len(p['images']) for p in posts)} rasm")
          PY

      - name: brand-import branch'iga saqlash
        env:
          CH: ${{ inputs.channel }}
        run: |
          cp -r out /tmp/brand-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan brand-import
          git rm -rfq .
          cp -r /tmp/brand-out/. .
          git add -A
          git commit -qm "Telegram kanal materiallari: $CH"
          git push -f origin brand-import
