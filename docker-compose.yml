# VPS uchun: bot + Caddy (avtomatik HTTPS). Ishga tushirish: docker compose up -d --build
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
      DB_PATH: /data/ayva.db
      PORT: "8080"
    volumes:
      # Baza va admin paneldan yuklangan rasmlar shu yerda saqlanadi
      - ayva-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  ayva-data:
  caddy-data:
